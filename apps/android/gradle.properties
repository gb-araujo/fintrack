org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# URL da API no build DEBUG. Com `adb reverse tcp:3333 tcp:3333`, localhost do dispositivo
# aponta para a API rodando na máquina de desenvolvimento (emulador ou celular via USB).
fintrack.debugApiBaseUrl=http://localhost:3333/

# URL da API no build RELEASE. Sobrescreva com -Pfintrack.apiBaseUrl=https://sua-api/ ou
# em ~/.gradle/gradle.properties.
fintrack.apiBaseUrl=https://api.fintrack.example/
